org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# org.gradle.caching is deliberately NOT enabled.
#
# Enabling the build cache while Gradle is pointed at an alternate build file
# makes the sync fail with "Build cache controller already set", which is how
# Android Studio invokes Gradle in some project layouts:
# https://github.com/gradle/gradle/issues/29747
#
# This is a single-module app, so the cache would save very little anyway.

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
